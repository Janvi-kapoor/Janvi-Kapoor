name: Live PR Counter Engine

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Execute Pull Request Analytics
        uses: gautamkrishnar/user-profile-details-action@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: "Janvi-kapoor"

      - name: Commit Verified Output Baselines
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && git diff --staged --quiet || (git commit -am "build: sync automated profile data metrics" && git push)
